{% extends 'base_staff.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h4>{{ title }}</h4>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success">

                Save Assessment

            </button>

            <a href="{% url 'assessment_list' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
