{% extends 'base_admin.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h4>{{ title }}</h4>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Username

                    </label>

                    {{ form.username }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Password

                    </label>

                    {{ form.password }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        First Name

                    </label>

                    {{ form.first_name }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Last Name

                    </label>

                    {{ form.last_name }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    {{ form.email }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Active

                    </label>

                    <br>

                    {{ form.is_active }}

                </div>

            </div>

            <button class="btn btn-success">

                Save User

            </button>

            <a href="{% url 'user_list' %}"

               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
