<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem("cnms-theme") || "light";
        document.documentElement.dataset.sidebarState =
            window.matchMedia("(max-width: 576px)").matches ? "collapsed" : "expanded";
    </script>

    <title>Administrator Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

<style>

:root{
    --bs-primary:#2F6F73;
    --bs-primary-rgb:47,111,115;
    --bs-success:#2F6F73;
    --bs-success-rgb:47,111,115;
    --bs-success-bg-subtle:#E3F0EF;
    --bs-success-border-subtle:#C7DFDD;
    --bs-success-text-emphasis:#275B5F;
    --cnms-accent:#E7A857;
}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;

}

body{

    background:
        radial-gradient(circle at top left, rgba(47, 111, 115, 0.14), transparent 28%),
        linear-gradient(135deg, #f8fbf8 0%, #f2f6f7 55%, #eef4fa 100%);

    color:#243447;
    overflow-x:hidden;

}

html[data-theme="dark"]{
    color-scheme:dark;
    --bs-body-color:#E2E8EA;
    --bs-body-color-rgb:226,232,234;
    --bs-body-bg:#172326;
    --bs-emphasis-color:#F1F5F6;
    --bs-secondary-color:rgba(226,232,234,.75);
    --bs-secondary-bg:#263438;
    --bs-tertiary-bg:#1D2B2F;
    --bs-border-color:#3B4B4F;
    --bs-heading-color:#E8EFF0;
    --bs-card-bg:#202E32;
    --bs-card-color:#E2E8EA;
    --bs-success-bg-subtle:#263D3F;
    --bs-success-border-subtle:#3B6264;
    --bs-success-text-emphasis:#B5D7D8;
    --bs-table-color:#E2E8EA;
    --bs-table-bg:#202E32;
    --bs-table-border-color:#3B4B4F;
    --bs-table-striped-bg:#263438;
    --bs-table-striped-color:#E2E8EA;
    --bs-table-hover-bg:#2C3B3F;
    --bs-table-hover-color:#F1F5F6;
}

html[data-theme="dark"] body{
    background:linear-gradient(135deg,#172326 0%,#1C292D 55%,#202E32 100%);
    color:#E2E8EA;
}

html[data-theme="dark"] body::before,
html[data-theme="dark"] body::after{
    opacity:.12;
}

html[data-theme="dark"] .sidebar{
    background:#151F22;
    color:#E2E8EA;
}

html[data-theme="dark"] .sidebar a{
    color:#D6E0E2;
}

html[data-theme="dark"] .sidebar a:hover{
    color:white;
}

html[data-theme="dark"] .topbar,
html[data-theme="dark"] .admin-card{
    background:#202E32;
    color:#E2E8EA;
}

html[data-theme="dark"] .topbar{
    border-color:#3B4B4F;
}

html[data-theme="dark"] .card,
html[data-theme="dark"] .modal-content,
html[data-theme="dark"] .dropdown-menu,
html[data-theme="dark"] .list-group-item,
html[data-theme="dark"] .accordion-item{
    color:#E2E8EA;
}

html[data-theme="dark"] .bg-white{
    background-color:#202E32!important;
    color:#E2E8EA!important;
}

html[data-theme="dark"] .bg-light{
    background-color:#263438!important;
    color:#E2E8EA!important;
}

html[data-theme="dark"] .table-success{
    --bs-table-color:#D7E6E6;
    --bs-table-bg:#263D3F;
    --bs-table-border-color:#3B6264;
    --bs-table-striped-bg:#2D4547;
    --bs-table-hover-bg:#344D4F;
}

html[data-theme="dark"] .form-control,
html[data-theme="dark"] .form-select,
html[data-theme="dark"] .input-group-text{
    background-color:#1D2B2F;
    border-color:#526267;
    color:#E2E8EA;
}

html[data-theme="dark"] .form-control::placeholder{
    color:#AAB9BC;
}

html[data-theme="dark"] .form-control:focus,
html[data-theme="dark"] .form-select:focus{
    background-color:#1D2B2F;
    color:#F1F5F6;
}

.theme-toggle,
.logout-button{
    flex-shrink:0;
}

html[data-theme="dark"] .theme-toggle,
html[data-theme="dark"] .logout-button{
    color:#F1F5F6;
    border-color:#74868A;
}

html[data-theme="dark"] .theme-toggle:hover,
html[data-theme="dark"] .logout-button:hover{
    background:#34474B;
    border-color:#9AABAE;
    color:white;
}

body::before,
body::after{
    content:'';
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    pointer-events:none;
    z-index:0;
}

body::before{
    width:280px;
    height:280px;
    top:-60px;
    left:-60px;
    background:#2F6F73;
}

body::after{
    width:260px;
    height:260px;
    right:-40px;
    bottom:-40px;
    background:#E7A857;
}

/* ==========================
   SIDEBAR
========================== */

.sidebar{

    position:fixed;
    top:0;
    left:0;

    width:270px;
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    overscroll-behavior:contain;

    background:#212529;

    color:white;

    z-index:1000;
    transition:transform .25s ease, width .25s ease;

}

.logo{

    background:#2F6F73;

    padding:25px;

    text-align:center;

}

.community-mark{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-bottom:4px;
    vertical-align:middle;
}

.community-mark .community-people{
    font-size:42px;
}

.community-mark .community-heart{
    position:absolute;
    right:-9px;
    bottom:-3px;
    display:grid;
    width:22px;
    height:22px;
    place-items:center;
    border:2px solid #2F6F73;
    border-radius:50%;
    background:#E7A857;
    color:#275B5F;
    font-size:12px;
}

.logo h4{

    margin-top:10px;

    font-size:18px;

    font-weight:bold;

    color:white;

}

.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px 22px;

    color:#dee2e6;

    text-decoration:none;

    transition:.3s;

}

.sidebar a:hover{

    background:#2F6F73;

    color:white;

}

.sidebar a i{

    font-size:20px;

}

/* ==========================
CONTENT
========================== */

.content{

    margin-left:270px;

    min-height:100vh;
    transition:margin-left .25s ease;

}

.topbar{

    background:white;

    padding:18px 30px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.topbar-row{
    flex-wrap:nowrap!important;
    min-width:0;
}

.topbar-brand{
    min-width:0;
}

.topbar-actions{
    flex-wrap:nowrap;
    flex-shrink:0;
}

@media(max-width:992px){
    .topbar-brand h4{
        display:none;
    }
}

@media(max-width:576px){
    .topbar{
        padding:10px;
    }

    .topbar-actions{
        gap:.35rem!important;
    }

    .topbar-actions .theme-toggle,
    .topbar-actions .account-dropdown-toggle{
        padding:.25rem .4rem;
        font-size:11px;
        white-space:nowrap;
        max-width:130px;
        overflow:hidden;
        text-overflow:ellipsis;
    }

}


.topbar h4{

    color:#2F6F73;

    margin:0;

    font-weight:700;

}

.content,
.main-content{
    position:relative;
    z-index:1;
}

.main-content{

    padding:30px;
    background:transparent;

}

.user-badge{

    background:#2F6F73;

    color:white;

    padding:8px 18px;

    border-radius:30px;

    font-size:14px;

}

.table-success{
    --bs-table-color:#254246;
    --bs-table-bg:#E3F0EF;
    --bs-table-border-color:#C7DFDD;
    --bs-table-striped-bg:#D8E9E7;
    --bs-table-hover-bg:#D1E4E2;
}

.btn-primary,
.btn-success{
    --bs-btn-bg:#2F6F73;
    --bs-btn-border-color:#2F6F73;
    --bs-btn-hover-bg:#275B5F;
    --bs-btn-hover-border-color:#275B5F;
    --bs-btn-active-bg:#234F53;
    --bs-btn-active-border-color:#234F53;
    --bs-btn-disabled-bg:#2F6F73;
    --bs-btn-disabled-border-color:#2F6F73;
}

.btn-outline-primary,
.btn-outline-success{
    --bs-btn-color:#2F6F73;
    --bs-btn-border-color:#2F6F73;
    --bs-btn-hover-bg:#2F6F73;
    --bs-btn-hover-border-color:#2F6F73;
    --bs-btn-active-bg:#275B5F;
    --bs-btn-active-border-color:#275B5F;
}

/* ==========================
RESPONSIVE
========================== */

html[data-sidebar-state="collapsed"] .sidebar{
    width:85px;
    transform:translateX(0);
}

html[data-sidebar-state="collapsed"] .logo{
    padding:18px 8px;
}

html[data-sidebar-state="collapsed"] .logo h4,
html[data-sidebar-state="collapsed"] .sidebar a span{
    display:none;
}

html[data-sidebar-state="collapsed"] .community-mark{
    margin:0;
}

html[data-sidebar-state="collapsed"] .sidebar a{
    justify-content:center;
    padding:16px 0;
}

html[data-sidebar-state="collapsed"] .content{
    margin-left:85px;
}

html[data-sidebar-state="expanded"] .sidebar{
    width:270px;
    transform:translateX(0);
}

html[data-sidebar-state="expanded"] .logo h4{
    display:block;
}

html[data-sidebar-state="expanded"] .sidebar a span{
    display:inline;
}

html[data-sidebar-state="expanded"] .content{
    margin-left:270px;
}

.sidebar-backdrop{
    display:none;
}

.sidebar-toggle{
    flex-shrink:0;
}

.sidebar-toggle i{
    font-size:18px;
}

@media(max-width:576px){
    html[data-sidebar-state="collapsed"] .sidebar{
        width:min(270px, 85vw);
        transform:translateX(-100%);
    }

    html[data-sidebar-state="collapsed"] .content,
    html[data-sidebar-state="expanded"] .content{
        margin-left:0;
    }

    html[data-sidebar-state="expanded"] .sidebar{
        width:min(270px, 85vw);
        transform:translateX(0);
    }

    html[data-sidebar-state="expanded"] .sidebar-backdrop{
        display:block;
        position:fixed;
        inset:0;
        z-index:999;
        border:0;
        background:rgba(0,0,0,.4);
    }
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar" id="admin-sidebar">

    <div class="logo">

        <span class="community-mark" aria-hidden="true">
            <i class="bi bi-people-fill community-people"></i>
            <i class="bi bi-heart-fill community-heart"></i>
        </span>

        <h4>

            ADMIN PANEL

        </h4>

    </div>

    <a href="{% url 'admin_dashboard' %}">

        <i class="bi bi-house-door-fill"></i>

        <span>Dashboard</span>

    </a>

    <a href="{% url 'assessment_list' %}">

        <i class="bi bi-heart-pulse-fill"></i>

        <span>Nutrition Assessment</span>

    </a>

    <a href="{% url 'resident_list' %}">
        <i class="bi bi-people-fill"></i>
        <span>Residents</span>
    </a>

    <a href="{% url 'followup_list' %}">
        <i class="bi bi-clipboard2-pulse"></i>
        <span>Follow-ups</span>
    </a>

    <a href="{% url 'analytics' %}">

        <i class="bi bi-bar-chart-fill"></i>

        <span>Analytics</span>

    </a>

    <a href="{% url 'report_dashboard' %}">

        <i class="bi bi-file-earmark-text-fill"></i>

        <span>Reports</span>

    </a>

    <a href="{% url 'activity_logs' %}">

        <i class="bi bi-clock-history"></i>

        <span>Audit Trail</span>

    </a>

    <a href="{% url 'archived_records' %}">

        <i class="bi bi-archive-fill"></i>

        <span>Archived Records</span>

    </a>

    <a href="{% url 'user_list' %}">

    <i class="bi bi-person-gear"></i>

    <span>Manage Users</span>

</a>

    </div>

    <button type="button" class="sidebar-backdrop" data-sidebar-close
            aria-label="Close navigation menu"></button>

        <!-- CONTENT -->

<div class="content">

    <div class="topbar">

        <div class="topbar-row d-flex justify-content-between align-items-center gap-3">

            <div class="topbar-brand d-flex align-items-center gap-3">
                <button type="button" class="btn btn-sm btn-outline-secondary sidebar-toggle"
                        data-sidebar-toggle aria-controls="admin-sidebar"
                        aria-expanded="true" aria-label="Collapse navigation">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <h4>
                    Community-Based Nutritional Monitoring and Decision Support System
                </h4>
            </div>

            <div class="topbar-actions d-flex align-items-center gap-3">
                <button type="button" class="btn btn-sm btn-outline-secondary theme-toggle"
                        data-theme-toggle aria-pressed="false">
                    <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
                    <span>Dark mode</span>
                </button>
                <div class="dropdown account-dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle account-dropdown-toggle"
                            type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1" aria-hidden="true"></i>
                        {{ request.user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="{% url 'account_settings' %}">
                                <i class="bi bi-gear me-2" aria-hidden="true"></i>Settings
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item" href="{% url 'logout' %}">
                                <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>

    </div>

    <div class="main-content">

        {% block content %}

        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (() => {
        const sidebarToggle = document.querySelector("[data-sidebar-toggle]");
        const sidebarClose = document.querySelector("[data-sidebar-close]");
        const sidebar = document.getElementById("admin-sidebar");
        const sidebarRoot = document.documentElement;

        const setSidebarState = (isExpanded) => {
            sidebarRoot.dataset.sidebarState = isExpanded ? "expanded" : "collapsed";
            sidebar.inert = !isExpanded && window.matchMedia("(max-width: 576px)").matches;
            sidebarToggle.setAttribute("aria-expanded", String(isExpanded));
            sidebarToggle.setAttribute(
                "aria-label",
                isExpanded ? "Collapse navigation" : "Expand navigation"
            );
        };

        setSidebarState(sidebarRoot.dataset.sidebarState === "expanded");
        window.matchMedia("(max-width: 576px)").addEventListener("change", () => {
            setSidebarState(sidebarRoot.dataset.sidebarState === "expanded");
        });
        sidebarToggle.addEventListener("click", () => {
            setSidebarState(sidebarRoot.dataset.sidebarState !== "expanded");
        });
        sidebarClose.addEventListener("click", () => setSidebarState(false));
    })();
</script>

<script>
    (() => {
        const themeToggle = document.querySelector("[data-theme-toggle]");
        const themeRoot = document.documentElement;

        const updateThemeToggle = () => {
            const isDark = themeRoot.dataset.theme === "dark";
            themeToggle.setAttribute("aria-pressed", String(isDark));
            themeToggle.querySelector("i").className =
                isDark ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
            themeToggle.querySelector("span").textContent =
                isDark ? "Light mode" : "Dark mode";
        };

        updateThemeToggle();
        themeToggle.addEventListener("click", () => {
            themeRoot.dataset.theme =
                themeRoot.dataset.theme === "dark" ? "light" : "dark";
            localStorage.setItem("cnms-theme", themeRoot.dataset.theme);
            updateThemeToggle();
        });
    })();
</script>

<script>
    (() => {
        const goToLogin = () => {
            window.location.replace("{% url 'logout' %}");
        };

        window.history.pushState({ logoutOnBack: true }, "", window.location.href);
        window.addEventListener("popstate", goToLogin);
    })();
</script>

</body>

</html>
