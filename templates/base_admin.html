<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administrator Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;

}

body{

    background:
        radial-gradient(circle at top left, rgba(25, 135, 84, 0.14), transparent 28%),
        linear-gradient(135deg, #f8fbf8 0%, #f2f6f7 55%, #eef4fa 100%);

    color:#243447;
    overflow-x:hidden;

}

body::before,
body::after{
    content:'';
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    pointer-events:none;
    z-index:0;
}

body::before{
    width:280px;
    height:280px;
    top:-60px;
    left:-60px;
    background:#9be6b3;
}

body::after{
    width:260px;
    height:260px;
    right:-40px;
    bottom:-40px;
    background:#cfe8ff;
}

/* ==========================
   SIDEBAR
========================== */

.sidebar{

    position:fixed;
    top:0;
    left:0;

    width:270px;
    height:100vh;

    background:#212529;

    color:white;

    z-index:1000;

}

.logo{

    background:#198754;

    padding:25px;

    text-align:center;

}

.logo i{

    font-size:45px;

}

.logo h4{

    margin-top:10px;

    font-size:18px;

    font-weight:bold;

    color:white;

}

.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px 22px;

    color:#dee2e6;

    text-decoration:none;

    transition:.3s;

}

.sidebar a:hover{

    background:#198754;

    color:white;

}

.sidebar a i{

    font-size:20px;

}

/* ==========================
CONTENT
========================== */

.content{

    margin-left:270px;

    min-height:100vh;

}

.topbar{

    background:white;

    padding:18px 30px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.topbar h4{

    color:#198754;

    margin:0;

    font-weight:700;

}

.content,
.main-content{
    position:relative;
    z-index:1;
}

.main-content{

    padding:30px;
    background:transparent;

}

.user-badge{

    background:#198754;

    color:white;

    padding:8px 18px;

    border-radius:30px;

    font-size:14px;

}

/* ==========================
RESPONSIVE
========================== */

@media(max-width:992px){

.sidebar{

    width:85px;

}

.logo h4{

    display:none;

}

.sidebar a span{

    display:none;

}

.content{

    margin-left:85px;

}

}

@media(max-width:576px){

.sidebar{

    display:none;

}

.content{

    margin-left:0;

}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <i class="bi bi-shield-lock-fill"></i>

        <h4>

            ADMIN PANEL

        </h4>

    </div>

    <a href="{% url 'admin_dashboard' %}">

        <i class="bi bi-speedometer2"></i>

        <span>Dashboard</span>

    </a>

    <a href="{% url 'admin_resident_list' %}">

        <i class="bi bi-people-fill"></i>

        <span>Residents</span>

    </a>

    <a href="{% url 'assessment_list' %}">

        <i class="bi bi-heart-pulse-fill"></i>

        <span>Nutrition Assessment</span>

    </a>

    <a href="{% url 'analytics' %}">

        <i class="bi bi-bar-chart-fill"></i>

        <span>Analytics</span>

    </a>

    <a href="{% url 'report_dashboard' %}">

    <i class="bi bi-file-earmark-text-fill"></i>

    <span>Reports</span>

</a>

<a href="{% url 'activity_logs' %}">

    <i class="bi bi-clock-history"></i>

    <span>Activity Logs</span>

</a>

<a href="{% url 'user_list' %}">

    <i class="bi bi-person-gear"></i>

    <span>User Management</span>

</a>

    <a href="{% url 'logout' %}">

        <i class="bi bi-box-arrow-right"></i>

        <span>Logout</span>

    </a>

</div>

<!-- CONTENT -->

<div class="content">

    <div class="topbar">

        <div class="d-flex justify-content-between align-items-center">

            <h4>

                Community-Based Nutritional Monitoring and Decision Support System

            </h4>

            <div class="user-badge">

                <i class="bi bi-person-circle"></i>

                {{ request.user.username }}

            </div>

        </div>

    </div>

    <div class="main-content">

        {% block content %}

        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
